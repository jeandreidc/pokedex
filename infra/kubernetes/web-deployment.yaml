apiVersion: apps/v1
kind: Deployment
metadata:
  name: kota-pokedex-web
  labels:
    app: kota-pokedex-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kota-pokedex-web
  template:
    metadata:
      labels:
        app: kota-pokedex-web
    spec:
      containers:
        - name: web
          image: kota-pokedex-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
